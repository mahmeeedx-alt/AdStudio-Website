# ============================================
# BACKEND CONFIGURATION
# ============================================
backend:
  name: git-gateway
  branch: main

# ============================================
# MEDIA FOLDER (Where images are stored)
# ============================================
media_folder: "assets/ads"
public_folder: "/assets/ads"

# ============================================
# COLLECTIONS
# ============================================
collections:
  # ---------- ADS COLLECTION ----------
  - name: "ads"
    label: "Ads"
    label_singular: "Ad"
    folder: "data"
    create: true
    extension: json
    format: json
    slug: "ads"
    summary: "{{title}} ({{category}})"
    fields:
      - { label: "Ad Title", name: "title", widget: "string", required: true }
      - { label: "Brand Name", name: "brand", widget: "string", required: true }
      - { label: "Category", name: "category", widget: "select", options: ["Fashion", "Technology", "Sportswear", "Automotive", "Lifestyle", "Other"], required: true }
      - { label: "Brand Image", name: "imagePath", widget: "image", required: true }
      - { label: "Website URL", name: "destinationUrl", widget: "string", required: true, pattern: ['https?://.+', 'Must start with http:// or https://'] }
      - { label: "Short Description", name: "description", widget: "text", required: false, default: "Discover our premium collection" }
      - { label: "Featured", name: "featured", widget: "boolean", default: true, required: false }
      - { label: "Order", name: "order", widget: "number", default: 0, required: false }

  # ---------- SETTINGS COLLECTION (For contact info) ----------
  - name: "settings"
    label: "Settings"
    label_singular: "Setting"
    folder: "data"
    create: false
    extension: json
    format: json
    slug: "settings"
    summary: "Site Settings"
    fields:
      - { label: "Contact Email", name: "contactEmail", widget: "string", required: true, default: "mahmeeed.x@gmail.com" }
      - { label: "Site Title", name: "siteTitle", widget: "string", required: true, default: "AdStudio" }
      - { label: "Footer Text", name: "footerText", widget: "text", required: true, default: "© 2026 AdStudio. All rights reserved." }