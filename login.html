<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - AdStudio Admin</title>
  <style>
    body {
      background: #07070e;
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: white;
    }
    .login-container {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    h1 span {
      background: linear-gradient(135deg, #ff3366, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #b8b8d0;
      margin-bottom: 30px;
    }
    input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
      color: white;
      font-size: 1rem;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #ff3366, #7c3aed);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(255,51,102,0.3);
    }
    .error {
      color: #ff3366;
      margin-top: 12px;
      font-size: 0.9rem;
    }
    a {
      color: #b8b8d0;
      text-decoration: none;
      font-size: 0.85rem;
    }
    a:hover {
      color: white;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Ad<span>Studio</span></h1>
    <p>Login to manage your ads</p>
    
    <form id="login-form">
      <input type="email" id="email" placeholder="Email" value="mahmeeed.x@gmail.com" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    
    <div id="error-message" class="error"></div>
    <br>
    <a href="#" id="forgot-link">Forgot password?</a>
  </div>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    const netlifyIdentity = window.netlifyIdentity;
    
    // Initialize Netlify Identity
    netlifyIdentity.init();
    
    // Login form
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error-message');
      
      try {
        const user = await netlifyIdentity.login(email, password);
        errorEl.textContent = '';
        console.log('Logged in:', user);
        
        // Redirect to admin panel
        window.location.href = '/admin';
      } catch (error) {
        errorEl.textContent = 'Login failed: ' + error.message;
        console.error(error);
      }
    });
    
    // Forgot password
    document.getElementById('forgot-link').addEventListener('click', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const errorEl = document.getElementById('error-message');
      
      if (!email) {
        errorEl.textContent = 'Please enter your email address';
        return;
      }
      
      try {
        await netlifyIdentity.requestPasswordReset(email);
        errorEl.textContent = 'Password reset email sent! Check your inbox.';
        errorEl.style.color = '#fbbf24';
      } catch (error) {
        errorEl.textContent = 'Error: ' + error.message;
        errorEl.style.color = '#ff3366';
      }
    });
  </script>
</body>
</html>
